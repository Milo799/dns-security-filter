# ============================================================================
# DNS 安全过滤平台（检测 + Web 管理）配置模板 · 全注释版
# ============================================================================
# 用途：
#   平台是"检测决策"层：接收代理转发的查询 → 黑白名单/离线大名单/在线情报
#   多级检测 → 放行的走公网递归解析回真实 IP，拦截的回告警引导页 IP。
#   同时提供 Web 管理界面（8080）做名单/策略/日志管理。
#
# 使用方法：
#   cp platform.example.yaml platform.yaml  然后按注释逐项修改。
#   标 ★ 的 4 项生产必改：jwt_secret / admin_initial_password /
#   upstream_dns / alert_ip。
#
# 生效方式：
#   dns/web/database 四项改后须重启两个服务：
#     sudo systemctl restart platform-dns platform-web
#   其余项（检测/日志/缓存类）大多支持 Web 配置页在线热生效
#   （存 SQLite system_config，运行时覆盖本文件值）。
#
# 字段与代码的对应关系：platform/config.py 的 PlatformConfig（默认值同源）。
# ============================================================================

# ── DNS 服务（接收代理转发的查询）─────────────────────────────────────────
dns:
  listen_addr: 0.0.0.0      # 监听地址。0.0.0.0=接收任意来源（须靠防火墙限制
                            #   仅机 A 代理 IP 可达 15353，见部署文档 3.2 节）。
  listen_port: 53           # 监听端口。
                            #   双机部署官方建议 15353（与代理 config.yaml 的
                            #   upstream_port 一致；不与终端直连无需占用 53）。
                            #   同机/直连终端场景可用 53（需 setcap 授权）。

# ── Web 管理界面 ────────────────────────────────────────────────────────────
web:
  listen_addr: 0.0.0.0      # 监听地址。生产建议 0.0.0.0 + 防火墙限运维网段，
                            #   或改内网网卡 IP 缩小暴露面。
  listen_port: 8080         # Web 端口。浏览器访问 http://平台IP:8080。
  jwt_secret: change-me     # ★ 登录令牌签名密钥。生产必须改为 ≥32 位随机串：
                            #   openssl rand -hex 32
                            #   泄露 = 任何人可伪造登录态，务必妥善保管。
  jwt_expire_minutes: 480   # 登录态有效期（分钟），默认 480=8 小时。

# ── 存储 ────────────────────────────────────────────────────────────────────
database: ./data/platform.db  # SQLite 数据库路径（相对 platform/ 工作目录）。
                              #   Docker 部署固定 /app/data/platform.db。
                              #   名单/日志/配置全在此库，备份就备这一个文件
                              #   （热备建议用 sqlite3 .backup，避免拷到半写状态）。

# ── 上游递归 ────────────────────────────────────────────────────────────────
upstream_dns: 8.8.8.8       # ★ 放行域名的公网递归 DNS。
                            #   国内生产建议 223.5.5.5（阿里，实测 ~40ms）；
                            #   备选 119.29.29.29（腾讯）；8.8.8.8 跨境抖动
                            #   300~1000ms，不建议。
                            #   ⚠️ 严禁指向本系统自身（代理或平台）——会成环。

# ── 拦截应答 ────────────────────────────────────────────────────────────────
alert_ip: 127.0.0.1         # ★ 拦截域名的 A 记录应答 IP。
                            #   终端访问被拦域名时被引导到这个地址——生产建议
                            #   指向内网"告警引导页"服务器 IP（页面上写
                            #   "该域名已被安全策略拦截"+ 申诉入口）。
alert_ttl: 60               # 拦截应答的 TTL（秒）。过短则终端重复查询量大，
                            #   过长则策略解除后终端仍被引导一段时间。默认 60。

# ── 检测策略 ────────────────────────────────────────────────────────────────
fusion_strategy: any        # 多个在线情报源的融合判定策略：
                            #   any      任一源命中即拦截（最严，默认）
                            #   majority 过半数源命中才拦截
                            #   all      全部源命中才拦截（最宽松）
                            #   也可在 Web「策略管理→融合策略」页在线切换。
detection_enabled: true     # 检测总开关。
                            #   true  = 正常检测拦截
                            #   false = 全部放行（应急开关：怀疑平台误拦时
                            #           先切 false 止血，再排查；Web 页可切）
api_timeout_ms: 2000        # 单个在线情报源 API 调用超时（毫秒）。
                            #   超时算"无结论"（不是未命中），走 fail-safe。
                            #   2000 为均衡值；调大增加查询延迟上限。

# ── 域名检测结论缓存（10 万终端性能关键项）────────────────────────────────
domain_cache_ttl_s: 300     # 缓存 TTL（秒）。放行结论默认 300s=5 分钟：
                            #   热点域名 95%+ 查询直接走内存，不触发检测链。
                            #   拦截结论缓存 1 小时（代码内置，不可配）。
                            #   越大越省检测资源，策略变更生效越慢
                            #   （名单变更时代码会主动失效，基本无感）。
domain_cache_size: 1000000  # 缓存容量上限（条，LRU 淘汰）。
                            #   百万级条目约占内存 2~4 GB，与机器内存匹配着调
                            #   （32G 机器可满配；16G 建议 50 万 + hagezi_mini）。

# ── IP 检测结论缓存（解析速度关键项，与域名缓存同构）─────────────────────
ip_cache_ttl_s: 900         # 缓存 TTL（秒，1~86400）。IP 后置过滤的结论缓存：
                            #   热门域名应答 IP 高度集中（CDN Top IP 扛住绝大多数
                            #   流量），命中后跳过全部在线查询。IP 情报变化慢于
                            #   域名，默认 15 分钟比域名缓存（5 分钟）略长。
ip_cache_size: 200000       # 缓存容量上限（条，LRU 淘汰）。20 万条约 30MB；
                            #   实测命中路径 12ms（未命中实时查 DNSBL 单轮 2s）。

# ── fail-safe 与熔断降级 ────────────────────────────────────────────────────
failsafe_mode: intercept    # 在线情报源"无结论"（超时/网络失败）时的兜底：
                            #   intercept = 默认拦截（最安全，默认值）
                            #   degrade   = 降级放行（可用性优先）
                            #   生产建议 intercept + 熔断（下两项）组合。
cb_failure_threshold: 5     # 源级熔断：连续失败多少次后熔断该源（0=禁用）。
                            #   被限流/挂掉的源熔断后不再调用，冷却期结束探活。
cb_open_timeout_s: 60       # 源级熔断：冷却时长（秒），默认 60。
degrade_threshold: 3        # 路径级降级：连续多少次 fail-safe 触发整体降级
                            #   （0=禁用）。防止"全部无结论→全部默认拦截"
                            #   的全网误伤。
degrade_window_s: 300       # 路径级降级：降级窗口时长（秒），默认 300。

# ── 日志 ────────────────────────────────────────────────────────────────────
log_retention_days: 90      # 过滤日志保留天数，超期自动清理。
allow_log_enabled: false    # 放行日志开关。拦截/剔除日志必录不采样；
                            #   放行日志量 = 全量查询，10 万终端默认关
                            #   （溯源需求见下一项采样折中）。
allow_log_sample_rate: 100  # 放行日志采样率（%，0~100）。开了放行日志但嫌量大：
                            #   设 1 = 仅留 1%（确定性采样，任意连续 100 次
                            #   命中数恰等于设定值，分布均匀可用于统计还原）。
log_async_enabled: true     # 日志异步批量写入开关（SQLite 削峰）：
                            #   true  = 内存队列 + 后台线程批量落库（生产默认，
                            #           1000 QPS 实测 P95 从 75.7ms → 1.09ms）
                            #   false = 同步直写（排障定位用，性能差）
log_flush_interval_s: 2     # 异步写入 flush 间隔（秒，1~60）。
log_batch_size: 500         # 异步单批写入上限（条，100~50000）。
                            #   观测接口 GET /api/log-writer/stats 的
                            #   dropped>0 = 写入跟不上 → 调大批量或查磁盘 IO。

# ── 离线大名单自动更新 ──────────────────────────────────────────────────────
threatlist_auto_update: false  # 总开关。false=仅启动时加载已有名单；
                              #   true=按周期自动从源站拉取更新（需出站网络）。
threatlist_auto_interval_hours: 24  # 自动更新间隔（小时，1~720）。
                              #   实际各源周期 = min(本值, 源内置周期)：
                              #   用户只能缩短长周期源（如 hagezi 24h→1h），
                              #   不影响短周期源（urlhaus 固定 30 分钟哨兵）。

# ── 管理员 ──────────────────────────────────────────────────────────────────
admin_initial_password: admin123  # ★ 首次初始化管理员密码（生产必须改，
                              #   且首登后再在 Web 改一次）。仅首次建库生效，
                              #   之后改此值无效（走 Web 改密）。

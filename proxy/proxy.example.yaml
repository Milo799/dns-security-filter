# ============================================================================
# DNS 安全过滤代理（dns-proxy）配置模板 · 全注释版
# ============================================================================
# 用途：
#   代理是"纯转发"层，不做任何检测——终端/域控 DNS 的查询先到代理，
#   代理原样转发给检测平台，平台应答后原样回传（ID/EDNS0 均不改动）。
#
# 使用方法：
#   cp proxy.example.yaml config.yaml   然后按本文件注释逐项修改。
#   仅 3 项必改（标 ★）：upstream_addr / upstream_port / forward_timeout。
#
# 生效方式：
#   修改后重启服务：sudo systemctl restart proxy
# ============================================================================

# ── 监听（谁把 DNS 查询发给代理）──────────────────────────────────────────
listen_addr: 0.0.0.0        # 监听地址。
                            #   0.0.0.0 = 接收任意来源（生产默认，域控要连它）
                            #   127.0.0.1 = 仅本机（本机测试用）
listen_port: 53             # 监听端口。DNS 标准端口 53（UDP+TCP 同时监听）。
                            #   注意：绑定 <1024 端口需要 root，或由安装脚本
                            #   setcap cap_net_bind_service 授权（脚本已自动做）。
                            #   本机测试避开 53 可改 15354。

# ── 上游（代理把查询转发给谁）──────────────────────────────────────────────
upstream_addr: 10.0.0.50    # ★ 检测平台的 IP。
                            #   双机部署：填机 B 内网 IP（如 192.168.10.21）
                            #   同机部署：填 127.0.0.1
upstream_port: 53           # ★ 平台 DNS 服务端口。
                            #   双机部署：平台不与终端直连，官方模板建议 15353
                            #   （须与 platform.yaml 的 dns.listen_port 一致）
                            #   同机部署：53 会被代理占用，平台必须错开（15353）

# ── 转发行为 ────────────────────────────────────────────────────────────────
forward_timeout: 8          # ★ 等待平台应答的超时（秒）。
                            #   平台完整检测路径（在线情报源并发查询 + 公网递归）
                            #   实测耗时 2~5s，超时不足会放大成大面积 SERVFAIL。
                            #   生产建议 ≥8；纯离线名单场景可降到 3~5。
                            #   超时后代理回 SERVFAIL（快速失败，不静默挂起），
                            #   终端侧表现为"约 N 秒后解析失败"而非无限等待。

log_enabled: false          # 代理运行日志开关（stdout，由 systemd journal 收集）。
                            #   每条查询一行，10 万终端下量大，生产默认关闭；
                            #   排障时临时开：改 true 后 systemctl restart proxy。

# ── 客户端 IP 注入（Task #158）──────────────────────────────────────────────
ecs_enabled: true           # 转发前把真实客户端源 IP 写入 EDNS0 Client
                            #   Subnet（RFC 7871）。平台的过滤日志"客户端 IP"
                            #   由此而来——Windows 转发器/直连客户端都不发
                            #   ECS，不注入则日志里客户端 IP 恒为空。
                            #   请求已带 ECS（如上级转发器已注入）时透传不改写。
                            #   特殊环境（上游不兼容 OPT 扩展）可改 false 关闭。
